<!-- @dsCard group="Colors" viewport="700x180" name="Neutrals" subtitle="White, cream, cocoa alphas — no greys, no black" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:#fff;font-family:var(--font-body);color:var(--cocoa-900);box-sizing:border-box}.n{font:700 12px var(--font-body)}.v{font:500 11px ui-monospace,Menlo,monospace;color:var(--cocoa-500)}</style></head><body><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px"><div style="display:flex;flex-direction:column;gap:6px"><div style="height:88px;border-radius:16px;background:var(--white);box-shadow:inset 0 0 0 1px var(--cocoa-alpha-28)"></div><span class="n">white</span><span class="v">--white<br>#FFFFFF</span></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:88px;border-radius:16px;background:var(--cream-50);box-shadow:inset 0 0 0 1px var(--cocoa-alpha-28)"></div><span class="n">cream</span><span class="v">--cream-50<br>#F7F6F4</span></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:88px;border-radius:16px;background:var(--cocoa-alpha-28);"></div><span class="n">hairline</span><span class="v">--cocoa-alpha-28<br>cocoa 28%</span></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:88px;border-radius:16px;background:var(--cocoa-alpha-12);"></div><span class="n">tint</span><span class="v">--cocoa-alpha-12<br>cocoa 12%</span></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:88px;border-radius:16px;background:var(--scrim);"></div><span class="n">scrim</span><span class="v">--scrim<br>cocoa 55%</span></div></div></body></html>
