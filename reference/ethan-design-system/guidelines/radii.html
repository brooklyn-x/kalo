<!-- @dsCard group="Spacing" viewport="700x170" name="Corner radii" subtitle="Soft, chunky corners; pills for every control" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:#fff;font-family:var(--font-body);color:var(--cocoa-900);box-sizing:border-box}.n{font:700 12px var(--font-body)}.v{font:500 11px ui-monospace,Menlo,monospace;color:var(--cocoa-500)}.g{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.g>div{display:flex;flex-direction:column;gap:6px}.s{height:80px;background:var(--mint-200)}</style></head><body><div class="g"><div><div class="s" style="border-radius:var(--radius-xs)"></div><span class="n">xs</span><span class="v">6px</span></div><div><div class="s" style="border-radius:var(--radius-sm)"></div><span class="n">sm</span><span class="v">12px</span></div><div><div class="s" style="border-radius:var(--radius-md)"></div><span class="n">md</span><span class="v">20px</span></div><div><div class="s" style="border-radius:var(--radius-lg)"></div><span class="n">lg</span><span class="v">28px</span></div><div><div class="s" style="border-radius:var(--radius-xl)"></div><span class="n">xl</span><span class="v">36px</span></div><div><div class="s" style="border-radius:var(--radius-pill)"></div><span class="n">pill</span><span class="v">999px</span></div></div></body></html>
