<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:#fff;font-family:var(--font-body);color:var(--cocoa-900);box-sizing:border-box}.n{font:700 12px var(--font-body)}.v{font:500 11px ui-monospace,Menlo,monospace;color:var(--cocoa-500)}.p{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.p div{height:96px;border-radius:16px;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;box-sizing:border-box;font:400 26px/1 var(--font-display);text-transform:uppercase}.p small{font:700 10px var(--font-body);text-transform:lowercase;margin-top:6px}</style></head><body><div class="p"><div style="background:var(--sun-500)">Aa<small>cocoa / sun</small></div><div style="background:var(--mint-200)">Aa<small>cocoa / mint</small></div><div style="background:var(--teal-500)">Aa<small>cocoa / teal</small></div><div style="background:var(--orange-500)">Aa<small>cocoa / orange</small></div><div style="background:var(--maroon-700);color:#fff">Aa<small>white / maroon</small></div><div style="background:var(--cocoa-900);color:var(--sun-500)">Aa<small style="color:#fff">sun / cocoa</small></div></div></body></html>
