<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:#fff;font-family:var(--font-body);color:var(--cocoa-900);box-sizing:border-box}.n{font:700 12px var(--font-body)}.v{font:500 11px ui-monospace,Menlo,monospace;color:var(--cocoa-500)}</style></head><body><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px"><div style="display:flex;flex-direction:column;gap:6px"><div style="height:88px;border-radius:16px;background:var(--sun-500);"></div><span class="n">sun</span><span class="v">--sun-500<br>#FDC607</span></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:88px;border-radius:16px;background:var(--butter-300);"></div><span class="n">butter</span><span class="v">--butter-300<br>#FFD654</span></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:88px;border-radius:16px;background:var(--mint-200);"></div><span class="n">mint</span><span class="v">--mint-200<br>#9AE2D7</span></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:88px;border-radius:16px;background:var(--teal-500);"></div><span class="n">teal</span><span class="v">--teal-500<br>#00B39D</span></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:88px;border-radius:16px;background:var(--cocoa-900);"></div><span class="n">cocoa</span><span class="v">--cocoa-900<br>#52282A</span></div></div></body></html>
