<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:#fff;font-family:var(--font-body);color:var(--cocoa-900);box-sizing:border-box}.n{font:700 12px var(--font-body)}.v{font:500 11px ui-monospace,Menlo,monospace;color:var(--cocoa-500)}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.t{display:flex;align-items:center;gap:8px;padding:6px 0}.d{width:22px;height:22px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px var(--cocoa-alpha-28)}</style></head><body><div class="g"><div class="t"><span class="d" style="background:var(--surface-page)"></span><span class="v" style="color:var(--cocoa-900)">--surface-page</span></div><div class="t"><span class="d" style="background:var(--surface-panel)"></span><span class="v" style="color:var(--cocoa-900)">--surface-panel</span></div><div class="t"><span class="d" style="background:var(--surface-panel-warm)"></span><span class="v" style="color:var(--cocoa-900)">--surface-panel-warm</span></div><div class="t"><span class="d" style="background:var(--surface-media)"></span><span class="v" style="color:var(--cocoa-900)">--surface-media</span></div><div class="t"><span class="d" style="background:var(--surface-inverse)"></span><span class="v" style="color:var(--cocoa-900)">--surface-inverse</span></div><div class="t"><span class="d" style="background:var(--surface-field-muted)"></span><span class="v" style="color:var(--cocoa-900)">--surface-field-muted</span></div><div class="t"><span class="d" style="background:var(--text-body)"></span><span class="v" style="color:var(--cocoa-900)">--text-body</span></div><div class="t"><span class="d" style="background:var(--text-muted)"></span><span class="v" style="color:var(--cocoa-900)">--text-muted</span></div><div class="t"><span class="d" style="background:var(--text-highlight-on-dark)"></span><span class="v" style="color:var(--cocoa-900)">--text-highlight-on-dark</span></div><div class="t"><span class="d" style="background:var(--action-primary)"></span><span class="v" style="color:var(--cocoa-900)">--action-primary</span></div><div class="t"><span class="d" style="background:var(--action-secondary)"></span><span class="v" style="color:var(--cocoa-900)">--action-secondary</span></div><div class="t"><span class="d" style="background:var(--border-hairline)"></span><span class="v" style="color:var(--cocoa-900)">--border-hairline</span></div><div class="t"><span class="d" style="background:var(--status-success)"></span><span class="v" style="color:var(--cocoa-900)">--status-success</span></div><div class="t"><span class="d" style="background:var(--status-warning)"></span><span class="v" style="color:var(--cocoa-900)">--status-warning</span></div><div class="t"><span class="d" style="background:var(--status-danger)"></span><span class="v" style="color:var(--cocoa-900)">--status-danger</span></div><div class="t"><span class="d" style="background:var(--focus-ring)"></span><span class="v" style="color:var(--cocoa-900)">--focus-ring</span></div></div></body></html>
