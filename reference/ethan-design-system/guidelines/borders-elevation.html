<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--cream-50);font-family:var(--font-body);color:var(--cocoa-900);box-sizing:border-box}.n{font:700 12px var(--font-body)}.v{font:500 11px ui-monospace,Menlo,monospace;color:var(--cocoa-500)}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.g>div{display:flex;flex-direction:column;gap:8px}.s{height:84px;border-radius:20px;background:#fff}</style></head><body><div class="g"><div><div class="s" style="background:var(--mint-200)"></div><span class="n">flat panel</span><span class="v">--shadow-none</span></div><div><div class="s" style="box-shadow:inset 0 0 0 1.5px var(--cocoa-900)"></div><span class="n">ring</span><span class="v">--border-base 1.5px</span></div><div><div class="s" style="border-bottom:1px solid var(--cocoa-900);border-radius:0;background:none"></div><span class="n">hairline divider</span><span class="v">1px cocoa</span></div><div><div class="s" style="box-shadow:var(--shadow-pop)"></div><span class="n">overlay only</span><span class="v">--shadow-pop</span></div></div></body></html>
