<!-- @dsCard group="Spacing" viewport="700x150" name="Motion" subtitle="Quick ease-out, bouncy pops; hover to preview" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:#fff;font-family:var(--font-body);color:var(--cocoa-900);box-sizing:border-box}.n{font:700 12px var(--font-body)}.v{font:500 11px ui-monospace,Menlo,monospace;color:var(--cocoa-500)}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.g>div{display:flex;flex-direction:column;gap:8px}.t{height:56px;border-radius:99px;background:var(--mint-200);position:relative}.k{position:absolute;top:8px;left:8px;width:40px;height:40px;border-radius:50%;background:var(--cocoa-900)}body:hover .k{left:calc(100% - 48px)}</style></head><body><div class="g"><div><div class="t"><div class="k" style="transition:left var(--dur-fast) var(--ease-out)"></div></div><span class="v">--dur-fast 140 · --ease-out</span></div><div><div class="t"><div class="k" style="transition:left var(--dur-base) var(--ease-bounce)"></div></div><span class="v">--dur-base 240 · --ease-bounce</span></div><div><div class="t"><div class="k" style="transition:left var(--dur-slow) var(--ease-out)"></div></div><span class="v">--dur-slow 420 · --ease-out</span></div></div></body></html>
