<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:#fff;font-family:var(--font-body);color:var(--cocoa-900);box-sizing:border-box}.n{font:700 12px var(--font-body)}.v{font:500 11px ui-monospace,Menlo,monospace;color:var(--cocoa-500)}</style></head><body><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px"><div style="display:flex;flex-direction:column;gap:6px"><div style="height:88px;border-radius:16px;background:var(--orange-500);"></div><span class="n">orange</span><span class="v">--orange-500<br>#F57F1D</span></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:88px;border-radius:16px;background:var(--red-500);"></div><span class="n">red</span><span class="v">--red-500<br>#F14724</span></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:88px;border-radius:16px;background:var(--maroon-700);"></div><span class="n">maroon</span><span class="v">--maroon-700<br>#962131</span></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:88px;border-radius:16px;background:var(--cocoa-700);"></div><span class="n">cocoa 700</span><span class="v">--cocoa-700<br>#6E3A3C</span></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:88px;border-radius:16px;background:var(--cocoa-500);"></div><span class="n">cocoa 500</span><span class="v">--cocoa-500<br>#8A6062</span></div></div></body></html>
