<!doctype html><html><head><meta charset="utf-8"><title>ETHAN — Product page</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script><script src="data.js"></script>
<style>body{background:var(--surface-page);min-width:1200px}</style></head><body><div id="root"></div>
<script type="text/babel" src="SiteHeader.jsx"></script><script type="text/babel" src="ProductHero.jsx"></script><script type="text/babel" src="ValueProps.jsx"></script><script type="text/babel" src="InsideSection.jsx"></script><script type="text/babel" src="AlsoLike.jsx"></script><script type="text/babel" src="SiteFooter.jsx"></script>
<script type="text/babel">
const { Toast, Button, Dialog } = window.ETHANDesignSystem_b7e92e;
function App(){
  const [cart,setCart]=React.useState(2);const [toast,setToast]=React.useState(null);const [dlg,setDlg]=React.useState(false);
  const t=React.useRef();
  const show=(msg)=>{setToast(msg);clearTimeout(t.current);t.current=setTimeout(()=>setToast(null),3200);};
  return <div>
    <SiteHeader cartCount={cart} onCart={()=>show('your cart has '+cart+' items')}/>
    <ProductHero onAdd={(q,l)=>{setCart(c=>c+q);show(q+' × '+l+' added to cart!');}}/>
    <ValueProps/><InsideSection/><AlsoLike/>
    <SiteFooter onSubscribe={()=>setDlg(true)}/>
    {toast && <div style={{position:'fixed',bottom:32,left:'50%',transform:'translateX(-50%)',zIndex:90}}><Toast action={<Button size="sm" variant="secondary">view cart</Button>} onClose={()=>setToast(null)}>{toast}</Toast></div>}
    <Dialog open={dlg} onClose={()=>setDlg(false)} title="YOU'RE ON THE LIST!" actions={<Button block onClick={()=>setDlg(false)}>keep snacking</Button>}>Check your inbox for 10% off your first order.</Dialog>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
